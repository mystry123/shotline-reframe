name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Dependencies
        run: pip install -r requirements.txt ruff==0.14.0

      - name: Lint
        run: ruff check reframe tests

      # Clip-based tests skip here: the test videos aren't in git.
      - name: Tests
        run: pytest -q
